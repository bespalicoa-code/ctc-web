<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tineri îmbrățișați, privind spre orizont">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061A40"/>
      <stop offset=".45" stop-color="#0B2D5C"/>
      <stop offset=".8" stop-color="#155EEF"/>
      <stop offset="1" stop-color="#60C5FF"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#EAF5FF" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#60C5FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2196F3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2D5C"/>
      <stop offset="1" stop-color="#061A40"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="760" cy="470" r="330" fill="url(#sun)"/>
  <g fill="#EAF5FF" opacity=".5">
    <ellipse cx="260" cy="210" rx="180" ry="18"/><ellipse cx="340" cy="238" rx="150" ry="12"/>
    <ellipse cx="930" cy="170" rx="200" ry="16"/><ellipse cx="860" cy="200" rx="120" ry="10"/>
  </g>
  <!-- orizont / orasul -->
  <path d="M0 560 C200 520 380 560 560 535 C760 505 960 560 1200 520 V800 H0Z" fill="url(#hill)" opacity=".85"/>
  <g fill="#061A40" opacity=".9">
    <rect x="880" y="470" width="30" height="70"/><polygon points="880,470 895,430 910,470"/>
    <rect x="930" y="490" width="50" height="50"/><rect x="990" y="500" width="40" height="40"/>
    <rect x="1040" y="485" width="36" height="55"/>
  </g>
  <path d="M0 620 C220 585 420 640 640 610 C860 580 1020 630 1200 600 V800 H0Z" fill="#061A40"/>
  <!-- grup de tineri, de spate -->
  <g fill="#061A40">
    <g transform="translate(250 330)"><circle cx="0" cy="0" r="44"/><path d="M-80 330 C-80 150 -52 70 0 70 C52 70 80 150 80 330Z"/></g>
    <g transform="translate(400 300)"><circle cx="0" cy="0" r="48"/><path d="M-92 360 C-92 160 -58 74 0 74 C58 74 92 160 92 360Z"/></g>
    <g transform="translate(560 270)"><circle cx="0" cy="0" r="52"/><path d="M-100 400 C-100 170 -64 82 0 82 C64 82 100 170 100 400Z"/></g>
    <g transform="translate(730 300)"><circle cx="0" cy="0" r="48"/><path d="M-92 360 C-92 160 -58 74 0 74 C58 74 92 160 92 360Z"/></g>
    <g transform="translate(880 335)"><circle cx="0" cy="0" r="44"/><path d="M-80 330 C-80 150 -52 70 0 70 C52 70 80 150 80 330Z"/></g>
  </g>
  <!-- brate -->
  <g fill="none" stroke="#0B2D5C" stroke-width="34" stroke-linecap="round">
    <path d="M300 420 C340 410 360 410 380 420"/>
    <path d="M440 410 C490 395 520 395 545 410"/>
    <path d="M600 410 C650 395 690 395 715 410"/>
    <path d="M770 420 C810 410 840 410 860 425"/>
  </g>
</svg>
